events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;
        add_header X-Content-Type-Options "nosniff" always;
        error_page 404 /404.html;
        location = /404.html { internal; }
        location = / { try_files /index.html =404; }
        location = /linux { try_files /linux.html =404; }
        location = /git { try_files /git.html =404; }
        location = /docker { try_files /docker.html =404; }
        location = /aws { try_files /aws.html =404; }
        location = /vim { try_files /vim.html =404; }
        location = /nginx { try_files /nginx.html =404; }
        location = /linux/ { return 301 /linux; }
        location = /git/ { return 301 /git; }
        location = /docker/ { return 301 /docker; }
        location = /aws/ { return 301 /aws; }
        location = /vim/ { return 301 /vim; }
        location = /nginx/ { return 301 /nginx; }
        location ~ (^|/)\. { return 404; }
        location / { try_files $uri =404; }
    }
}